<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mushola Ar-Rohman V3 Cloudinary</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Poppins;
  background:#eef7f6;
  color:#103434;
}

nav{
  position:fixed;
  top:0;
  width:100%;
  background:white;
  padding:15px;
  display:flex;
  justify-content:space-between;
  z-index:999;
}

.hero{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

section{
  padding:60px 6%;
}

.carousel-wrapper{
  display:flex;
  overflow-x:auto;
  gap:15px;
}

.card{
  min-width:280px;
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 10px 20px rgba(0,0,0,.08);
}

.card img, .card video{
  width:100%;
  height:200px;
  object-fit:cover;
}

.card-content{
  padding:12px;
}

.viewer,.admin,.login{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  justify-content:center;
  align-items:center;
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
  🕌 Mushola Ar-Rohman
  <button onclick="openLogin()">⚙</button>
</nav>

<!-- HERO -->
<div class="hero">
  <div>
    <h1>Mushola Ar-Rohman</h1>
    <p>Ibadah adalah kebutuhan</p>
  </div>
</div>

<!-- GALERI -->
<section>
  <h2>Galeri Kegiatan</h2>
  <div class="carousel-wrapper" id="gallery"></div>
</section>

<!-- VIEWER -->
<div class="viewer" id="viewer" onclick="this.style.display='none'">
  <div id="viewerBox"></div>
</div>

<!-- LOGIN -->
<div class="login" id="login">
  <div style="background:white;padding:20px;border-radius:12px">
    <input type="password" id="pass" placeholder="password">
    <button onclick="login()">Login</button>
  </div>
</div>

<!-- ADMIN -->
<div class="admin" id="admin">
  <div style="background:white;padding:20px;border-radius:12px;width:300px">

    <h3>Upload Galeri</h3>

    <input id="title" placeholder="Judul"><br><br>
    <textarea id="desc" placeholder="Deskripsi"></textarea><br><br>
    <input type="date" id="date"><br><br>
    <input type="file" id="file" multiple><br><br>

    <button onclick="upload()">Upload</button>
  </div>
</div>

<script>
/* =========================
   CLOUDINARY CONFIG
========================= */
const CLOUD_NAME = "dqx4y6l8l";
const UPLOAD_PRESET = "mushola_upload";

/* =========================
   DATA GALERI LOCAL (SAFE ONLINE)
========================= */
let gallery = JSON.parse(localStorage.getItem("gallery")) || [];

/* =========================
   RENDER GALERI (FIX UI)
========================= */
function renderGallery(){

  const container = document.getElementById("galleryContainer");
  container.innerHTML = "";

  if(gallery.length === 0){
    container.innerHTML = "<p style='padding:20px'>Belum ada galeri</p>";
    return;
  }

  gallery.forEach((item, index)=>{

    const media = item.type === "video"
      ? `<video src="${item.url}" controls></video>`
      : `<img src="${item.url}" onclick="openViewer('${item.url}','image')">`;

    container.innerHTML += `
      <div class="card">
        ${media}
        <div class="card-content">
          <h3>${item.title}</h3>
          <p>${item.desc}</p>
          <div class="date">${item.date}</div>
        </div>
      </div>
    `;
  });
}

/* =========================
   VIEWER FIX
========================= */
function openViewer(src,type){

  const viewer = document.getElementById("viewer");
  const content = document.getElementById("viewerContent");

  if(type === "image"){
    content.innerHTML = `<img src="${src}" style="max-width:90%">`;
  }else{
    content.innerHTML = `<video src="${src}" controls autoplay style="max-width:90%"></video>`;
  }

  viewer.style.display = "flex";
}

function closeViewer(){
  document.getElementById("viewer").style.display = "none";
}

/* =========================
   UPLOAD CLOUDINARY (FIX FINAL)
========================= */
async function uploadMedia(){

  const title = document.getElementById("title").value;
  const desc = document.getElementById("desc").value;
  const date = document.getElementById("date").value;
  const files = document.getElementById("file").files;

  if(!title || !desc || !date){
    alert("Lengkapi data");
    return;
  }

  if(files.length === 0){
    alert("Pilih file");
    return;
  }

  for(let file of files){

    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", UPLOAD_PRESET);

    const res = await fetch(
      `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`,
      { method:"POST", body:formData }
    );

    const data = await res.json();

    gallery.unshift({
      title,
      desc,
      date,
      url: data.secure_url,
      type: file.type.startsWith("video") ? "video" : "image"
    });
  }

  localStorage.setItem("gallery", JSON.stringify(gallery));

  alert("Upload sukses");

  document.getElementById("title").value="";
  document.getElementById("desc").value="";
  document.getElementById("date").value="";
  document.getElementById("file").value="";

  closeAdmin();
  renderGallery();
}

/* =========================
   ADMIN CONTROL FIX
========================= */
function openLogin(){
  document.getElementById("loginScreen").style.display="flex";
}

function loginAdmin(){
  const pass = document.getElementById("adminPassword").value;

  if(pass === "123456"){
    document.getElementById("loginScreen").style.display="none";
    document.getElementById("adminPanel").style.display="flex";
  }else{
    alert("Password salah");
  }
}

function closeAdmin(){
  document.getElementById("adminPanel").style.display="none";
}

/* =========================
   PUSTAKA FIX (AMAN)
========================= */
let pustaka = JSON.parse(localStorage.getItem("pustaka")) || [];

function renderPustaka(){

  const wrap = document.getElementById("pustakaCrud");
  if(!wrap) return;

  wrap.innerHTML = "";

  pustaka.forEach((item,index)=>{

    wrap.innerHTML += `
      <div class="table-item">
        <div>
          <strong>${item.title}</strong>
        </div>
        <div>
          <button onclick="editPustaka(${index})">Edit</button>
          <button onclick="deletePustaka(${index})">Hapus</button>
        </div>
      </div>
    `;
  });
}

/* =========================
   INIT
========================= */
renderGallery();
renderPustaka();

</script>

</body>
</html>
