<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mushola AR-ROHMAN V14 REALTIME</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{font-family:Poppins;background:#061414;color:#fff;margin:0}
nav{position:fixed;top:0;left:0;right:0;background:#0008;padding:12px;display:flex;justify-content:space-between;z-index:99}
section{padding:90px 20px}
h2{color:#d4af37}

.card{background:#ffffff10;padding:12px;border-radius:12px;margin:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.carousel{display:flex;overflow-x:auto;gap:10px}

.admin-btn{
position:fixed;bottom:20px;right:20px;
width:60px;height:60px;border-radius:50%;
background:linear-gradient(45deg,#14b8a6,#d4af37);
border:none;font-size:22px;
}

.panel{
position:fixed;inset:0;background:#000c;
display:none;justify-content:center;align-items:center
}

.box{background:#111;padding:20px;border-radius:12px;width:90%;max-width:500px}
input,textarea{width:100%;margin:5px 0;padding:10px;border-radius:8px;border:none}

button{width:100%;padding:10px;border:none;background:#14b8a6;color:#fff;border-radius:8px}
</style>
</head>

<body>

<nav>
<div><b>AR-ROHMAN V14</b></div>
<div>Realtime System</div>
</nav>

<section>
<h2>DKM</h2>
<div class="grid">
<div class="card">Ketua: Ust Ahmad</div>
<div class="card">Sekretaris: Fikri</div>
<div class="card">Bendahara: Rohman</div>
</div>
</section>

<section>
<h2>Galeri Realtime</h2>
<div class="carousel" id="gallery"></div>
</section>

<section>
<h2>Pustaka Realtime</h2>
<div class="carousel" id="pustaka"></div>
</section>

<!-- ADMIN -->
<button class="admin-btn" onclick="openAdmin()">⚙</button>

<div class="panel" id="panel">
<div class="box">
<h3>Admin Login</h3>
<input type="password" id="pass" placeholder="password">
<button onclick="login()">login</button>

<div id="admin" style="display:none">

<h3>Tambah Galeri</h3>
<input id="title" placeholder="judul">
<input id="url" placeholder="image url">
<button onclick="addGallery()">add</button>

<h3>Tambah Pustaka</h3>
<input id="ptitle" placeholder="judul">
<textarea id="ptext"></textarea>
<button onclick="addPustaka()">add</button>

</div>

</div>
</div>

<script>
/* ================= SUPABASE ================= */
const supabase = window.supabase.createClient(
  "https://YOUR_PROJECT.supabase.co",
  "YOUR_ANON_KEY"
);

/* ================= STATE ================= */
let gallery = [];
let pustaka = [];

/* ================= INIT LOAD ================= */
async function loadData(){
  const g = await supabase.from("gallery").select("*").order("id",{ascending:false});
  const p = await supabase.from("pustaka").select("*").order("id",{ascending:false});

  gallery = g.data || [];
  pustaka = p.data || [];

  render();
}

/* ================= RENDER ================= */
function render(){
  document.getElementById("gallery").innerHTML =
    gallery.map(x=>`
      <div class="card">
        <img src="${x.url}" style="width:100%;border-radius:10px">
        <p>${x.title}</p>
      </div>
    `).join("");

  document.getElementById("pustaka").innerHTML =
    pustaka.map(x=>`
      <div class="card">
        <b>${x.title}</b>
        <p>${x.text}</p>
      </div>
    `).join("");
}

/* ================= REALTIME ================= */
function realtime(){
  supabase
  .channel('db')
  .on('postgres_changes',{event:'*',schema:'public',table:'gallery'},payload=>{
    loadData()
  })
  .on('postgres_changes',{event:'*',schema:'public',table:'pustaka'},payload=>{
    loadData()
  })
  .subscribe()
}

/* ================= ADMIN ================= */
function openAdmin(){
  document.getElementById("panel").style.display="flex"
}

function login(){
  if(pass.value==="123456"){
    admin.style.display="block"
  } else alert("salah")
}

async function addGallery(){
  await supabase.from("gallery").insert({
    title:title.value,
    url:url.value
  })
}

async function addPustaka(){
  await supabase.from("pustaka").insert({
    title:ptitle.value,
    text:ptext.value
  })
}

/* ================= START ================= */
loadData()
realtime()

</script>

</body>
</html>
