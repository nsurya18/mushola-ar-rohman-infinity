<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mushola AR-ROHMAN V9 CLOUD</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Poppins,sans-serif;
background:#071313;
color:#fff;
}

nav{
position:fixed;
top:0;
left:0;
width:100%;
padding:14px;
background:#0b1d1d;
display:flex;
justify-content:space-between;
z-index:9999;
}

nav a{color:#fff;text-decoration:none;margin:0 8px}

.hero{
padding:110px 20px 30px;
text-align:center;
}

section{padding:60px 20px}

.title{
text-align:center;
color:#d4af37;
margin-bottom:15px;
}

.carousel{
display:flex;
gap:12px;
overflow-x:auto;
}

.card{
min-width:250px;
background:rgba(255,255,255,.06);
padding:12px;
border-radius:12px;
}

.card img{
width:100%;
border-radius:10px;
}

.admin-btn{
position:fixed;
bottom:18px;
right:18px;
width:60px;
height:60px;
border-radius:50%;
border:none;
background:#14b8a6;
font-size:22px;
cursor:pointer;
}

.panel{
position:fixed;
inset:0;
background:rgba(0,0,0,.75);
display:none;
align-items:center;
justify-content:center;
}

.box{
background:#111;
padding:20px;
width:90%;
max-width:420px;
border-radius:10px;
}

input,textarea{
width:100%;
padding:10px;
margin:6px 0;
border:none;
border-radius:6px;
}

button{
width:100%;
padding:10px;
border:none;
border-radius:6px;
background:#14b8a6;
color:#fff;
cursor:pointer;
}
</style>
</head>

<body>

<nav>
<div>🕌 AR-ROHMAN V9</div>
<div>
<a href="#galeri">Galeri</a>
<a href="#pustaka">Pustaka</a>
</div>
</nav>

<div class="hero">
<h1>V9 CLOUD SYSTEM</h1>
<p>Stable Sync HP & Laptop + Cloud Ready</p>
</div>

<section id="galeri">
<div class="title">GALERI KEGIATAN</div>
<div class="carousel" id="gallery"></div>
</section>

<section id="pustaka">
<div class="title">PUSTAKA ILMU</div>
<div class="carousel" id="pustaka"></div>
</section>

<button class="admin-btn" onclick="openAdmin()">⚙</button>

<div class="panel" id="panel">
<div class="box">

<h3>Admin Login</h3>
<input type="password" id="pass" placeholder="password">
<button onclick="login()">Login</button>

<div id="admin" style="display:none">

<h4>Tambah Galeri</h4>
<input id="gtitle" placeholder="Judul">
<input id="gurl" placeholder="Image URL">
<button onclick="addGallery()">Tambah</button>

<h4>Tambah Pustaka</h4>
<input id="ptitle" placeholder="Judul">
<textarea id="pdesc" placeholder="Isi"></textarea>
<button onclick="addPustaka()">Tambah</button>

</div>

<button onclick="closeAdmin()">Tutup</button>

</div>
</div>

<script>

/* =========================
   CLOUD CONFIG (OPTIONAL)
========================= */
const CLOUD_API = ""; 
// contoh nanti:
// https://your-api.com/mushola

/* =========================
   SAFE STORAGE (ANTI ERROR)
========================= */
function load(key){
try{
return JSON.parse(localStorage.getItem(key)) || [];
}catch(e){
return [];
}
}

function save(key,data){
localStorage.setItem(key,JSON.stringify(data));
}

/* =========================
   DATA
========================= */
let gallery = load("gallery");
let pustaka = load("pustaka");

/* =========================
   RENDER
========================= */
function render(){

document.getElementById("gallery").innerHTML =
gallery.map(x=>`
<div class="card">
<img src="${x.url}">
<p>${x.title}</p>
</div>
`).join("") || "<p>Belum ada data</p>";

document.getElementById("pustaka").innerHTML =
pustaka.map(x=>`
<div class="card">
<h4>${x.title}</h4>
<p>${x.desc}</p>
</div>
`).join("") || "<p>Belum ada data</p>";

}

/* =========================
   ADMIN
========================= */
function openAdmin(){
panel.style.display="flex";
}

function closeAdmin(){
panel.style.display="none";
}

function login(){
if(pass.value==="123456"){
admin.style.display="block";
}
}

/* =========================
   ADD DATA (LOCAL + CLOUD READY)
========================= */
async function addGallery(){

const item = {
title:gtitle.value,
url:gurl.value
};

gallery.unshift(item);
save("gallery",gallery);

/* optional cloud sync */
if(CLOUD_API){
await fetch(CLOUD_API+"/gallery",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(item)
});
}

render();
}

async function addPustaka(){

const item = {
title:ptitle.value,
desc:pdesc.value
};

pustaka.unshift(item);
save("pustaka",pustaka);

/* optional cloud sync */
if(CLOUD_API){
await fetch(CLOUD_API+"/pustaka",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(item)
});
}

render();
}

/* =========================
   INIT
========================= */
render();

</script>

</body>
</html>
