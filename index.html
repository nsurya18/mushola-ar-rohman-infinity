<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mushola AR-ROHMAN V8 FIX</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
--primary:#0f766e;
--secondary:#14b8a6;
--gold:#d4af37;
--bg:#071313;
--card:rgba(255,255,255,.06);
--border:rgba(255,255,255,.08);
}

*{margin:0;padding:0;box-sizing:border-box;}

html{scroll-behavior:smooth;}

body{
font-family:'Poppins',sans-serif;
background:linear-gradient(180deg,#071313,#0b1d1d,#102525);
color:white;
overflow-x:hidden;
}

/* NAV */
nav{
position:fixed;
top:0;
left:0;
width:100%;
padding:16px 5%;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(5,15,15,.82);
backdrop-filter:blur(18px);
z-index:99999;
}

.logo{
font-size:1.1rem;
font-weight:700;
color:#f7d774;
}

.menu-toggle{
display:none;
font-size:2rem;
color:#f7d774;
cursor:pointer;
}

nav ul{
display:flex;
gap:10px;
list-style:none;
}

nav a{
text-decoration:none;
color:white;
padding:12px 16px;
border-radius:14px;
}

/* HERO */
.hero{
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:120px 20px 60px;
position:relative;
}

.hero::before{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.72)),
url('https://images.unsplash.com/photo-1512632578888-169bbbc64f33?q=80&w=1600&auto=format&fit=crop');
background-size:cover;
background-position:center;
}

.hero-content{position:relative;z-index:2;}

.hero h1{font-size:3rem;color:#f7d774;}

/* SECTION */
section{padding:75px 5%;}

.section-title{text-align:center;margin-bottom:35px;}

.section-title h2{color:#f7d774;}

/* CARD */
.card{
min-width:320px;
background:var(--card);
border:1px solid var(--border);
border-radius:18px;
overflow:hidden;
}

.carousel{
display:flex;
gap:20px;
overflow-x:auto;
scroll-snap-type:x mandatory;
}

/* GALERI */
.preview-slider{
display:flex;
overflow-x:auto;
scroll-snap-type:x mandatory;
}

.preview-slider img,
.preview-slider video{
min-width:100%;
height:220px;
object-fit:cover;
}

/* CONTENT */
.card-content{
padding:18px;
}

.date{
margin-top:10px;
color:#14b8a6;
font-size:.85rem;
}

.event-count{
color:#f7d774;
font-size:.8rem;
margin-top:8px;
}

.open-btn{
margin-top:12px;
width:100%;
padding:12px;
border:none;
border-radius:12px;
background:linear-gradient(45deg,#0f766e,#14b8a6);
color:white;
font-weight:600;
}

/* ADMIN */
.admin-btn{
position:fixed;
right:20px;
bottom:20px;
width:60px;
height:60px;
border-radius:50%;
background:linear-gradient(45deg,#0f766e,#14b8a6);
color:white;
font-size:22px;
display:flex;
align-items:center;
justify-content:center;
z-index:999999;
border:none;
cursor:pointer;
}

/* PANEL */
.panel{
position:fixed;
inset:0;
background:rgba(0,0,0,.85);
display:none;
justify-content:center;
align-items:center;
z-index:999999;
}

.box{
background:#111;
padding:20px;
border-radius:16px;
width:90%;
max-width:500px;
}

/* MOBILE */
@media(max-width:768px){
nav ul{
display:none;
position:absolute;
top:70px;
left:5%;
right:5%;
flex-direction:column;
background:#000;
padding:14px;
border-radius:12px;
}

nav ul.active{display:flex;}

.menu-toggle{display:block;}

.hero h1{font-size:2rem;}

.card{min-width:85%;}
}
</style>
</head>

<body>

<nav>
<div class="logo">🕌 AR-ROHMAN</div>
<div class="menu-toggle" onclick="toggleMenu()">☰</div>
<ul id="navMenu">
<li><a href="#galeri">Galeri</a></li>
<li><a href="#pustaka">Pustaka</a></li>
<li><a href="#kas">Kas</a></li>
</ul>
</nav>

<section class="hero">
<div class="hero-content">
<h1>Mushola AR-ROHMAN</h1>
</div>
</section>

<section id="galeri">
<div class="section-title"><h2>Galeri Kegiatan</h2></div>
<div class="carousel" id="gallery"></div>
</section>

<button class="admin-btn" onclick="openAdmin()">⚙</button>

<div class="panel" id="panel">
<div class="box">
<h3>Admin</h3>
<input id="title" placeholder="Judul">
<input id="url" placeholder="Image URL">
<button onclick="addGallery()">Tambah</button>
<button onclick="closeAdmin()">Tutup</button>
</div>
</div>

<script>

let gallery = JSON.parse(localStorage.getItem('gallery')) || [];

/* FIX MENU */
function toggleMenu(){
document.getElementById('navMenu').classList.toggle('active');
}

/* FIX GALERI SAFE HP */
function renderGallery(){
const wrap = document.getElementById('gallery');
wrap.innerHTML = '';

if(!gallery || gallery.length === 0){
wrap.innerHTML = "<p style='opacity:.6'>Belum ada kegiatan</p>";
return;
}

gallery.forEach((item,i)=>{
wrap.innerHTML += `
<div class="card">
<div class="preview-slider">
<img src="${item.url}">
</div>
<div class="card-content">
<h3>${item.title}</h3>
<div class="event-count">📁 1 Media</div>
</div>
</div>
`;
});
}

/* ADMIN */
function openAdmin(){
document.getElementById('panel').style.display='flex';
}

function closeAdmin(){
document.getElementById('panel').style.display='none';
}

function addGallery(){
const t = document.getElementById('title').value;
const u = document.getElementById('url').value;

if(!t || !u) return;

gallery.unshift({title:t,url:u});
localStorage.setItem('gallery',JSON.stringify(gallery));

renderGallery();
}

renderGallery();

</script>

</body>
</html>
