<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mushola AR-ROHMAN V8 FINAL FIX</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Poppins;
background:#061414;
color:#fff;
overflow-x:hidden;
}

/* NAV */
nav{
position:fixed;
top:0;
left:0;
right:0;
padding:12px 16px;
background:#000c;
z-index:9999;
display:flex;
justify-content:space-between;
}

/* HERO */
.hero{
padding:110px 20px 40px;
text-align:center;
}

/* SECTION */
section{
padding:40px 16px;
}

h2{
margin-bottom:12px;
color:#f7d774;
}

/* CAROUSEL FIX (HP & LAPTOP STABIL) */
.carousel{
display:flex;
gap:12px;
overflow-x:auto;
scroll-snap-type:x mandatory;
-webkit-overflow-scrolling:touch;
padding-bottom:10px;
}

.card{
flex:0 0 80%;
scroll-snap-align:center;
background:#ffffff12;
border-radius:14px;
padding:12px;
}

/* GAMBAR FIX RESPONSIVE */
.card img{
width:100%;
height:180px;
object-fit:cover;
border-radius:10px;
}

/* PUSTAKA */
.pustaka-card{
flex:0 0 80%;
background:#ffffff12;
padding:14px;
border-radius:14px;
}

/* ADMIN BUTTON FIX (NO BUG CLICK) */
.admin-btn{
position:fixed;
right:16px;
bottom:16px;
width:60px;
height:60px;
border-radius:50%;
background:linear-gradient(45deg,#14b8a6,#d4af37);
border:none;
z-index:99999;
cursor:pointer;
font-size:20px;
}

/* PANEL FIX */
.panel{
position:fixed;
inset:0;
background:rgba(0,0,0,.85);
display:none;
justify-content:center;
align-items:center;
z-index:999999;
}

.box{
background:#111;
padding:18px;
width:90%;
max-width:420px;
border-radius:12px;
}

input,textarea{
width:100%;
padding:10px;
margin:6px 0;
border-radius:8px;
border:none;
}

button{
width:100%;
padding:10px;
border:none;
border-radius:8px;
background:#14b8a6;
color:#fff;
cursor:pointer;
}
</style>
</head>

<body>

<nav>
<div>🕌 AR-ROHMAN</div>
</nav>

<section class="hero">
<h1>Mushola AR-ROHMAN</h1>
<p>Web Informasi Jamaah</p>
</section>

<section>
<h2>Galeri Kegiatan</h2>
<div class="carousel" id="gallery"></div>
</section>

<section>
<h2>Pustaka Ilmu</h2>
<div class="carousel" id="pustaka"></div>
</section>

<!-- ADMIN BUTTON -->
<button class="admin-btn" onclick="openAdmin()">⚙</button>

<!-- PANEL -->
<div class="panel" id="panel">
<div class="box">

<h3>Login Admin</h3>
<input type="password" id="pass">
<button onclick="login()">Login</button>

<div id="adminArea" style="display:none">

<h3>Tambah Galeri</h3>
<input id="gtitle" placeholder="Judul">
<input id="gurl" placeholder="Image URL">
<button onclick="addGallery()">Tambah</button>

<h3>Tambah Pustaka</h3>
<input id="ptitle" placeholder="Judul">
<textarea id="ptext" placeholder="Isi"></textarea>
<button onclick="addPustaka()">Tambah</button>

</div>

</div>
</div>

<script>
/* SAFE STORAGE (ANTI ERROR HP) */
let gallery = JSON.parse(localStorage.getItem("gallery") || "[]");
let pustaka = JSON.parse(localStorage.getItem("pustaka") || "[]");

/* RENDER */
function render(){

document.getElementById("gallery").innerHTML =
gallery.length ? gallery.map(x=>`
<div class="card">
<img src="${x.url}">
<p>${x.title}</p>
</div>
`).join("") : "<p style='opacity:.6'>Belum ada galeri</p>";

document.getElementById("pustaka").innerHTML =
pustaka.length ? pustaka.map(x=>`
<div class="pustaka-card">
<b>${x.title}</b>
<p>${x.text}</p>
</div>
`).join("") : "<p style='opacity:.6'>Belum ada pustaka</p>";

}

/* ADMIN */
function openAdmin(){
document.getElementById("panel").style.display="flex";
}

function login(){
if(document.getElementById("pass").value==="123456"){
document.getElementById("adminArea").style.display="block";
}
}

/* ADD DATA */
function addGallery(){
if(!gtitle.value || !gurl.value) return;

gallery.unshift({
title:gtitle.value,
url:gurl.value
});

localStorage.setItem("gallery",JSON.stringify(gallery));
render();
}

function addPustaka(){
if(!ptitle.value || !ptext.value) return;

pustaka.unshift({
title:ptitle.value,
text:ptext.value
});

localStorage.setItem("pustaka",JSON.stringify(pustaka));
render();
}

/* INIT */
render();
</script>

</body>
</html>
