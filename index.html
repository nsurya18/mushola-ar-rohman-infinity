<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mushola V3 Clean Fix</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:#eef7f6;
  color:#0f2f2f;
}

nav{
  position:fixed;
  top:0;
  width:100%;
  background:rgba(255,255,255,.9);
  display:flex;
  justify-content:space-between;
  padding:14px 20px;
  z-index:1000;
  backdrop-filter:blur(10px);
}

nav ul{
  display:flex;
  gap:15px;
  list-style:none;
}

nav a{
  text-decoration:none;
  color:#0f766e;
}

.hero{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:url('https://images.unsplash.com/photo-1524492412937-b28074a5d7da?q=80&w=1600') center/cover;
  color:white;
}

.hero h1{font-size:3rem;}

section{
  padding:60px 20px;
}

.title{
  text-align:center;
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

.card{
  background:white;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.card img, .card video{
  width:100%;
  height:180px;
  object-fit:cover;
}

.card-body{
  padding:10px;
}

/* CAROUSEL */
.carousel{
  display:flex;
  overflow-x:auto;
  gap:15px;
  scroll-snap-type:x mandatory;
}

.carousel .card{
  min-width:250px;
  scroll-snap-align:start;
}

/* DOT */
.dots{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:10px;
}

.dot{
  width:8px;height:8px;
  background:#aaa;
  border-radius:50%;
}

.dot.active{
  width:20px;
  border-radius:10px;
  background:#14b8a6;
}

/* VIEWER */
.viewer{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  display:none;
  justify-content:center;
  align-items:center;
}

.viewer img, .viewer video{
  max-width:90%;
  max-height:90%;
}

/* ADMIN */
.admin-btn{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#14b8a6;
  border:none;
  color:white;
  width:55px;
  height:55px;
  border-radius:50%;
  font-size:20px;
}

.panel{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  justify-content:center;
  align-items:center;
}

.box{
  background:white;
  padding:20px;
  border-radius:15px;
  width:90%;
  max-width:400px;
}

input,textarea{
  width:100%;
  margin:5px 0;
  padding:10px;
}

button{
  padding:10px;
  width:100%;
  background:#14b8a6;
  border:none;
  color:white;
}

</style>
</head>

<body>

<nav>
  <div><b>Mushola AR-Rohman</b></div>
  <ul>
    <li><a href="#galeri">Galeri</a></li>
    <li><a href="#pustaka">Pustaka</a></li>
  </ul>
</nav>

<div class="hero">
  <div>
    <h1>Mushola V3 CLEAN</h1>
    <p>Ibadah adalah kebutuhan</p>
  </div>
</div>

<!-- GALERI -->
<section id="galeri">
  <div class="title"><h2>Galeri Kegiatan</h2></div>
  <div class="carousel" id="gallery"></div>
  <div class="dots" id="dots"></div>
</section>

<!-- PUSTAKA -->
<section id="pustaka">
  <div class="title"><h2>Pustaka Islami</h2></div>
  <div class="grid" id="book"></div>
</section>

<!-- VIEWER -->
<div class="viewer" id="viewer" onclick="closeViewer()">
  <div id="viewerBox"></div>
</div>

<!-- ADMIN -->
<button class="admin-btn" onclick="openPanel()">⚙</button>

<div class="panel" id="panel">
  <div class="box">
    <h3>Upload Galeri</h3>
    <input id="title" placeholder="Judul">
    <textarea id="desc" placeholder="Deskripsi"></textarea>
    <input type="date" id="date">
    <input type="file" id="file" multiple>
    <button onclick="upload()">Upload</button>
  </div>
</div>

<script>

/* DATA */
let gallery = JSON.parse(localStorage.getItem("gallery")) || [];
let pustaka = JSON.parse(localStorage.getItem("pustaka")) || [
  {title:"Dzikir Pagi",text:"Dzikir memberi ketenangan hati"},
  {title:"Adab Masjid",text:"Masuk dengan kaki kanan"}
];

/* RENDER GALERI */
function renderGallery(){
  let el = document.getElementById("gallery");
  el.innerHTML="";

  gallery.forEach((g,i)=>{
    el.innerHTML += `
    <div class="card">
      ${g.type=="video"
        ? `<video src="${g.url}" controls></video>`
        : `<img src="${g.url}" onclick="openViewer('${g.url}','img')">`
      }
      <div class="card-body">
        <b>${g.title}</b><br>
        <small>${g.date}</small>
      </div>
    </div>`;
  });

  renderDots();
}

/* DOT */
function renderDots(){
  let dot = document.getElementById("dots");
  dot.innerHTML="";
  gallery.forEach((_,i)=>{
    dot.innerHTML += `<div class="dot"></div>`;
  });
}

/* VIEWER */
function openViewer(src,type){
  let box = document.getElementById("viewerBox");
  box.innerHTML = type=="img"
    ? `<img src="${src}">`
    : "";
  document.getElementById("viewer").style.display="flex";
}

function closeViewer(){
  document.getElementById("viewer").style.display="none";
}

/* PUSTAKA */
function renderBook(){
  let el = document.getElementById("book");
  el.innerHTML="";
  pustaka.forEach(p=>{
    el.innerHTML += `
    <div class="card">
      <div class="card-body">
        <b>${p.title}</b>
        <p>${p.text}</p>
      </div>
    </div>`;
  });
}

/* UPLOAD */
function upload(){
  let t=document.getElementById("title").value;
  let d=document.getElementById("desc").value;
  let dt=document.getElementById("date").value;
  let files=document.getElementById("file").files;

  if(!files.length) return alert("Pilih file");

  Array.from(files).forEach(f=>{
    let reader=new FileReader();
    reader.onload=e=>{
      gallery.unshift({
        title:t,
        desc:d,
        date:dt,
        url:e.target.result,
        type:f.type.startsWith("video")?"video":"image"
      });

      localStorage.setItem("gallery",JSON.stringify(gallery));
      renderGallery();
    };
    reader.readAsDataURL(f);
  });

  document.getElementById("panel").style.display="none";
}

/* ADMIN */
function openPanel(){
  document.getElementById("panel").style.display="flex";
}

/* INIT */
renderGallery();
renderBook();

</script>

</body>
</html>
