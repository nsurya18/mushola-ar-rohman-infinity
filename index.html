<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mushola AR-ROHMAN V10 CLOUD</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Poppins,sans-serif;
background:#071313;
color:#fff;
}

nav{
position:fixed;
top:0;
left:0;
width:100%;
padding:14px;
background:#0b1d1d;
display:flex;
justify-content:space-between;
z-index:9999;
}

nav a{
color:#fff;
text-decoration:none;
margin:0 8px;
}

.hero{
padding:110px 20px 30px;
text-align:center;
}

section{padding:60px 20px}

.title{
text-align:center;
color:#d4af37;
margin-bottom:15px;
}

.carousel{
display:flex;
gap:12px;
overflow-x:auto;
}

.card{
min-width:250px;
background:rgba(255,255,255,.06);
padding:12px;
border-radius:12px;
}

.card img{
width:100%;
border-radius:10px;
}

.admin-btn{
position:fixed;
bottom:18px;
right:18px;
width:60px;
height:60px;
border-radius:50%;
border:none;
background:#14b8a6;
font-size:22px;
cursor:pointer;
}

.panel{
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
display:none;
align-items:center;
justify-content:center;
}

.box{
background:#111;
padding:20px;
width:90%;
max-width:420px;
border-radius:10px;
}

input,textarea{
width:100%;
padding:10px;
margin:6px 0;
border:none;
border-radius:6px;
}

button{
width:100%;
padding:10px;
border:none;
border-radius:6px;
background:#14b8a6;
color:#fff;
cursor:pointer;
}
</style>
</head>

<body>

<nav>
<div>🕌 AR-ROHMAN V10</div>
<div>
<a href="#galeri">Galeri</a>
<a href="#pustaka">Pustaka</a>
</div>
</nav>

<div class="hero">
<h1>V10 CLOUDINARY SYNC</h1>
<p>Upload real ke cloud + auto sync HP & Laptop</p>
</div>

<section id="galeri">
<div class="title">GALERI KEGIATAN</div>
<div class="carousel" id="gallery"></div>
</section>

<section id="pustaka">
<div class="title">PUSTAKA ILMU</div>
<div class="carousel" id="pustaka"></div>
</section>

<button class="admin-btn" onclick="openAdmin()">⚙</button>

<div class="panel" id="panel">
<div class="box">

<h3>Admin Login</h3>
<input type="password" id="pass" placeholder="password">
<button onclick="login()">Login</button>

<div id="admin" style="display:none">

<h4>Upload Galeri (Cloudinary)</h4>
<input id="gtitle" placeholder="Judul">
<input type="file" id="gfile">
<button onclick="uploadGallery()">Upload</button>

<h4>Tambah Pustaka</h4>
<input id="ptitle" placeholder="Judul">
<textarea id="pdesc" placeholder="Isi"></textarea>
<button onclick="addPustaka()">Tambah</button>

</div>

<button onclick="closeAdmin()">Tutup</button>

</div>
</div>

<script>

/* ======================
   CLOUDINARY CONFIG
====================== */
const CLOUD_NAME = "dqx4y6l8l";
const UPLOAD_PRESET = "mushola_upload";

/* ======================
   STORAGE SAFE
====================== */
function load(k){
try{return JSON.parse(localStorage.getItem(k))||[]}
catch(e){return []}
}

function save(k,v){
localStorage.setItem(k,JSON.stringify(v));
}

let gallery = load("gallery");
let pustaka = load("pustaka");

/* ======================
   RENDER
====================== */
function render(){

gallery = load("gallery");
pustaka = load("pustaka");

document.getElementById("gallery").innerHTML =
gallery.map(x=>`
<div class="card">
<img src="${x.url}">
<p>${x.title}</p>
</div>
`).join("") || "<p>Belum ada data</p>";

document.getElementById("pustaka").innerHTML =
pustaka.map(x=>`
<div class="card">
<h4>${x.title}</h4>
<p>${x.desc}</p>
</div>
`).join("") || "<p>Belum ada data</p>";

}

/* ======================
   ADMIN
====================== */
function openAdmin(){
panel.style.display="flex";
}

function closeAdmin(){
panel.style.display="none";
}

function login(){
if(pass.value==="123456"){
admin.style.display="block";
}
}

/* ======================
   UPLOAD CLOUDINARY
====================== */
async function uploadGallery(){

const file = document.getElementById("gfile").files[0];
const title = gtitle.value;

if(!file || !title){
alert("lengkapi data");
return;
}

const form = new FormData();
form.append("file",file);
form.append("upload_preset",mushola_upload);

const res = await fetch(
`https://api.cloudinary.com/v1_1/${mushola_upload}/image/upload`,
{
method:"POST",
body:form
}
);

const data = await res.json();

let g = load("gallery");
g.unshift({
title,
url:data.secure_url
});

save("gallery",g);
render();

alert("upload sukses");
}

/* ======================
   PUSTAKA
====================== */
function addPustaka(){

if(!ptitle.value || !pdesc.value){
alert("isi lengkap");
return;
}

let p = load("pustaka");
p.unshift({
title:ptitle.value,
desc:pdesc.value
});

save("pustaka",p);
render();

}

/* ======================
   INIT
====================== */
render();

</script>

</body>
</html>
