<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mushola V12 SUPABASE FIX</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
margin:0;
font-family:Poppins;
background:#071313;
color:white;
}

nav{
padding:12px;
background:#0b1d1d;
display:flex;
justify-content:space-between;
}

section{padding:40px 20px}

.title{
text-align:center;
color:#d4af37;
margin-bottom:15px;
}

.carousel{
display:flex;
gap:12px;
overflow-x:auto;
}

.card{
min-width:240px;
background:rgba(255,255,255,.06);
padding:10px;
border-radius:10px;
}

.card img{
width:100%;
border-radius:8px;
}

.admin-btn{
position:fixed;
bottom:18px;
right:18px;
width:60px;
height:60px;
border-radius:50%;
border:none;
background:#14b8a6;
font-size:22px;
cursor:pointer;
}

.panel{
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
display:none;
align-items:center;
justify-content:center;
}

.box{
background:#111;
padding:20px;
width:90%;
max-width:400px;
border-radius:10px;
}

input,button{
width:100%;
padding:10px;
margin:6px 0;
border:none;
border-radius:6px;
}

button{
background:#14b8a6;
color:white;
cursor:pointer;
}
</style>
</head>

<body>

<nav>
<div>🕌 Mushola V12</div>
<div>SUPABASE LIVE</div>
</nav>

<section>
<div class="title">GALERI</div>
<div class="carousel" id="gallery"></div>
</section>

<section>
<div class="title">PUSTAKA</div>
<div class="carousel" id="pustaka"></div>
</section>

<button class="admin-btn" onclick="openAdmin()">⚙</button>

<div class="panel" id="panel">
<div class="box">

<h3>Admin Login</h3>
<input type="password" id="pass">
<button onclick="login()">Login</button>

<div id="adminArea" style="display:none">

<h4>Tambah Galeri</h4>
<input id="title" placeholder="judul">
<input id="url" placeholder="image url">
<button onclick="addGallery()">Tambah</button>

<h4>Tambah Pustaka</h4>
<input id="ptitle" placeholder="judul">
<input id="pdesc" placeholder="deskripsi">
<button onclick="addPustaka()">Tambah</button>

</div>

</div>
</div>

<script>
/* =======================
   SUPABASE CONFIG FIXED
======================= */
const SUPABASE_URL = "https://rsynvidexpuyaqrwzihz.supabase.co";
const SUPABASE_KEY = "sb_publishable_lYkKnzv2JTGEa8A_mEFJiw_JQIcWzP1";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* =======================
   LOAD DATA
======================= */
async function loadGallery(){
const { data } = await supabaseClient
.from("gallery")
.select("*")
.order("created_at",{ascending:false});

renderGallery(data || []);
}

async function loadPustaka(){
const { data } = await supabaseClient
.from("pustaka")
.select("*")
.order("created_at",{ascending:false});

renderPustaka(data || []);
}

/* =======================
   RENDER
======================= */
function renderGallery(data){
document.getElementById("gallery").innerHTML =
data.map(x=>`
<div class="card">
<img src="${x.url}">
<p>${x.title}</p>
</div>
`).join("");
}

function renderPustaka(data){
document.getElementById("pustaka").innerHTML =
data.map(x=>`
<div class="card">
<h4>${x.title}</h4>
<p>${x.desc}</p>
</div>
`).join("");
}

/* =======================
   INSERT DATA
======================= */
async function addGallery(){
await supabaseClient.from("gallery").insert({
title:title.value,
url:url.value
});

title.value="";
url.value="";
loadGallery();
}

async function addPustaka(){
await supabaseClient.from("pustaka").insert({
title:ptitle.value,
desc:pdesc.value
});

ptitle.value="";
pdesc.value="";
loadPustaka();
}

/* =======================
   REALTIME SYNC
======================= */
supabaseClient
.channel("gallery-channel")
.on("postgres_changes",{event:"*",schema:"public",table:"gallery"},loadGallery)
.subscribe();

supabaseClient
.channel("pustaka-channel")
.on("postgres_changes",{event:"*",schema:"public",table:"pustaka"},loadPustaka)
.subscribe();

/* =======================
   ADMIN
======================= */
function openAdmin(){
panel.style.display="flex";
}

function login(){
if(pass.value==="123456"){
adminArea.style.display="block";
}
}

/* INIT */
loadGallery();
loadPustaka();
</script>

</body>
</html>
