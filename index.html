<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mushola AR-ROHMAN V8 FIX</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Poppins,sans-serif;
background:#071313;
color:#fff;
}

nav{
position:fixed;
top:0;
left:0;
width:100%;
padding:14px;
background:#0b1d1d;
display:flex;
justify-content:space-between;
z-index:9999;
}

nav ul{
display:flex;
gap:10px;
list-style:none;
}

nav a{
color:#fff;
text-decoration:none;
}

.hero{
padding:120px 20px 40px;
text-align:center;
}

section{
padding:60px 20px;
}

.section-title{
text-align:center;
margin-bottom:20px;
color:#d4af37;
}

.carousel{
display:flex;
gap:15px;
overflow-x:auto;
}

.card{
min-width:250px;
background:rgba(255,255,255,.06);
padding:15px;
border-radius:12px;
}

.card img{
width:100%;
border-radius:10px;
}

.admin-btn{
position:fixed;
bottom:20px;
right:20px;
width:60px;
height:60px;
border-radius:50%;
background:#14b8a6;
border:none;
font-size:24px;
cursor:pointer;
}

.panel{
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
display:none;
justify-content:center;
align-items:center;
}

.box{
background:#111;
padding:20px;
width:90%;
max-width:400px;
border-radius:10px;
}

input,textarea{
width:100%;
margin:5px 0;
padding:10px;
border:none;
border-radius:6px;
}

button{
width:100%;
padding:10px;
margin-top:5px;
background:#14b8a6;
border:none;
color:#fff;
border-radius:6px;
cursor:pointer;
}
</style>
</head>

<body>

<nav>
<div>🕌 Mushola AR-ROHMAN</div>
<ul>
<li><a href="#galeri">Galeri</a></li>
<li><a href="#pustaka">Pustaka</a></li>
</ul>
</nav>

<div class="hero">
<h1>V8 FIX SYSTEM</h1>
<p>Galeri & Pustaka sudah disinkronkan</p>
</div>

<section id="galeri">
<div class="section-title">GALERI KEGIATAN</div>
<div class="carousel" id="gallery"></div>
</section>

<section id="pustaka">
<div class="section-title">PUSTAKA ILMU</div>
<div class="carousel" id="pustakaList"></div>
</section>

<button class="admin-btn" onclick="openAdmin()">⚙</button>

<div class="panel" id="panel">
<div class="box">

<h3>Admin Login</h3>
<input type="password" id="pass" placeholder="password">
<button onclick="login()">Login</button>

<div id="adminArea" style="display:none">

<h3>Tambah Galeri</h3>
<input id="gtitle" placeholder="Judul">
<input id="gurl" placeholder="Image URL">
<button onclick="addGaleri()">Tambah</button>

<h3>Tambah Pustaka</h3>
<input id="ptitle" placeholder="Judul">
<textarea id="pdesc" placeholder="Isi"></textarea>
<button onclick="addPustaka()">Tambah</button>

</div>

<button onclick="closeAdmin()">Tutup</button>
</div>
</div>

<script>
let gallery = JSON.parse(localStorage.getItem("gallery") || "[]");
let pustaka = JSON.parse(localStorage.getItem("pustaka") || "[]");

function render(){
document.getElementById("gallery").innerHTML =
gallery.map(x =>
`<div class="card">
<img src="${x.url}">
<p>${x.title}</p>
</div>`
).join("");

document.getElementById("pustakaList").innerHTML =
pustaka.map(x =>
`<div class="card">
<h4>${x.title}</h4>
<p>${x.desc}</p>
</div>`
).join("");
}

function openAdmin(){
document.getElementById("panel").style.display="flex";
}

function closeAdmin(){
document.getElementById("panel").style.display="none";
}

function login(){
if(pass.value==="123456"){
adminArea.style.display="block";
}
}

function addGaleri(){
gallery.unshift({
title:gtitle.value,
url:gurl.value
});
localStorage.setItem("gallery",JSON.stringify(gallery));
render();
}

function addPustaka(){
pustaka.unshift({
title:ptitle.value,
desc:pdesc.value
});
localStorage.setItem("pustaka",JSON.stringify(pustaka));
render();
}

render();
</script>

</body>
</html>
