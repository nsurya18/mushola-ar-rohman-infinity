<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mushola AR-ROHMAN V8 STABLE+</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
--primary:#0f766e;
--secondary:#14b8a6;
--gold:#d4af37;
--bg:#071313;
--card:rgba(255,255,255,.06);
--border:rgba(255,255,255,.08);
}

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}

body{
font-family:'Poppins',sans-serif;
background:linear-gradient(180deg,#071313,#0b1d1d,#102525);
color:white;
overflow-x:hidden;
}

/* NAV */
nav{
position:fixed;
top:0;left:0;
width:100%;
padding:16px 5%;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(5,15,15,.85);
backdrop-filter:blur(18px);
z-index:99999;
}

.logo{color:#f7d774;font-weight:700;}

.menu-toggle{display:none;font-size:2rem;color:#f7d774;cursor:pointer;}

nav ul{display:flex;gap:10px;list-style:none;}

nav a{
text-decoration:none;
color:white;
padding:10px 14px;
border-radius:12px;
}

/* HERO */
.hero{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:120px 20px;
}

.hero::before{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.7)),
url('https://images.unsplash.com/photo-1512632578888-169bbbc64f33?q=80&w=1600&auto=format&fit=crop');
background-size:cover;
background-position:center;
}

.hero-content{position:relative;z-index:2;}

.hero h1{font-size:3rem;color:#f7d774;}

/* SECTION */
section{padding:75px 5%;}
.section-title{text-align:center;margin-bottom:30px;}
.section-title h2{color:#f7d774;}

/* CARDS */
.card{
background:var(--card);
border:1px solid var(--border);
border-radius:16px;
padding:14px;
}

/* CAROUSEL */
.carousel{
display:flex;
gap:15px;
overflow-x:auto;
}

/* GALERI */
.preview-slider img{
width:100%;
border-radius:12px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}

.grid-box{
background:var(--card);
padding:18px;
border-radius:14px;
text-align:center;
border:1px solid var(--border);
}

/* KAS */
.kas-box{
text-align:center;
font-size:1.2rem;
color:#f7d774;
}

/* ADMIN */
.admin-btn{
position:fixed;
right:18px;
bottom:18px;
width:60px;
height:60px;
border-radius:50%;
background:linear-gradient(45deg,#0f766e,#14b8a6);
color:white;
font-size:22px;
display:flex;
justify-content:center;
align-items:center;
z-index:999999;
border:none;
cursor:pointer;
}

/* PANEL */
.panel{
position:fixed;
inset:0;
background:rgba(0,0,0,.85);
display:none;
justify-content:center;
align-items:center;
z-index:999999;
}

.box{
background:#111;
padding:20px;
border-radius:14px;
width:90%;
max-width:500px;
}

input{
width:100%;
padding:12px;
margin:6px 0;
border-radius:10px;
border:none;
}

/* MOBILE */
@media(max-width:768px){
.menu-toggle{display:block;}
nav ul{
display:none;
position:absolute;
top:70px;
left:5%;
right:5%;
flex-direction:column;
background:#000;
padding:14px;
border-radius:12px;
}
nav ul.active{display:flex;}
.hero h1{font-size:2rem;}
}
</style>
</head>

<body>

<nav>
<div class="logo">🕌 AR-ROHMAN</div>
<div class="menu-toggle" onclick="toggleMenu()">☰</div>
<ul id="menu">
<li><a href="#galeri">Galeri</a></li>
<li><a href="#pengajian">Pengajian</a></li>
<li><a href="#dkm">DKM</a></li>
<li><a href="#kas">Kas</a></li>
</ul>
</nav>

<section class="hero">
<div class="hero-content">
<h1>Mushola AR-ROHMAN</h1>
</div>
</section>

<!-- GALERI -->
<section id="galeri">
<div class="section-title"><h2>Galeri</h2></div>
<div class="carousel" id="gallery"></div>
</section>

<!-- PENGAJIAN -->
<section id="pengajian">
<div class="section-title"><h2>Pengajian</h2></div>
<div class="carousel">
<div class="card">Yasinan Kamis</div>
<div class="card">TPQ Anak</div>
<div class="card">Majelis Ibu</div>
</div>
</section>

<!-- DKM -->
<section id="dkm">
<div class="section-title"><h2>DKM</h2></div>
<div class="grid">
<div class="grid-box">Ketua: Ust. Ahmad</div>
<div class="grid-box">Sekretaris: Fikri</div>
<div class="grid-box">Bendahara: Rohman</div>
</div>
</section>

<!-- KAS -->
<section id="kas">
<div class="section-title"><h2>Kas Mushola</h2></div>
<div class="grid">
<div class="grid-box kas-box">Saldo<br>Rp 12.500.000</div>
<div class="grid-box kas-box">Masuk<br>Rp 3.250.000</div>
<div class="grid-box kas-box">Keluar<br>Rp 1.200.000</div>
</div>
</section>

<!-- ADMIN -->
<button class="admin-btn" onclick="openAdmin()">⚙</button>

<div class="panel" id="panel">
<div class="box">
<h3>Admin Galeri</h3>
<input id="title" placeholder="Judul">
<input id="url" placeholder="URL Gambar">
<button onclick="addGallery()">Tambah</button>
<button onclick="closeAdmin()">Tutup</button>
</div>
</div>

<script>

let gallery = JSON.parse(localStorage.getItem('gallery')) || [];

/* MENU */
function toggleMenu(){
document.getElementById('menu').classList.toggle('active');
}

/* GALERI FIX AMAN */
function renderGallery(){
const wrap = document.getElementById('gallery');
wrap.innerHTML = '';

if(!gallery.length){
wrap.innerHTML = "<p style='opacity:.6'>Belum ada kegiatan</p>";
return;
}

gallery.forEach(item=>{
wrap.innerHTML += `
<div class="card">
<img src="${item.url}">
<p style="margin-top:8px">${item.title}</p>
</div>
`;
});
}

/* ADMIN */
function openAdmin(){
document.getElementById('panel').style.display='flex';
}

function closeAdmin(){
document.getElementById('panel').style.display='none';
}

function addGallery(){
const t = document.getElementById('title').value;
const u = document.getElementById('url').value;

if(!t || !u) return;

gallery.unshift({title:t,url:u});
localStorage.setItem('gallery',JSON.stringify(gallery));

renderGallery();
}

renderGallery();

</script>

</body>
</html>
