<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Mushola V4 PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
--primary:#0f766e;
--secondary:#14b8a6;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#eef7f6;
color:#103434;
overflow-x:hidden;
}

/* NAV */

nav{
position:fixed;
top:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:16px 5%;
background:rgba(255,255,255,.85);
backdrop-filter:blur(12px);
z-index:999;
}

.logo{
font-weight:700;
font-size:1.1rem;
color:var(--primary);
}

nav ul{
display:flex;
gap:18px;
list-style:none;
}

nav a{
text-decoration:none;
color:#103434;
}

/* HERO */

.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
position:relative;
overflow:hidden;
}

.hero::before{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
url('https://images.unsplash.com/photo-1512632578888-169bbbc64f33?q=80&w=1600&auto=format&fit=crop');
background-size:cover;
background-position:center;
}

.hero-content{
position:relative;
z-index:2;
color:white;
}

.hero h1{
font-size:4rem;
margin-bottom:18px;
}

.hero p{
line-height:1.8;
margin-bottom:25px;
}

.btn{
display:inline-block;
padding:14px 28px;
border-radius:50px;
background:linear-gradient(45deg,var(--primary),var(--secondary));
color:white;
text-decoration:none;
font-weight:600;
}

/* SECTION */

section{
padding:70px 5%;
}

.title{
text-align:center;
margin-bottom:35px;
}

.title h2{
font-size:2rem;
margin-bottom:10px;
color:var(--primary);
}

/* CAROUSEL */

.carousel{
display:flex;
gap:20px;
overflow-x:auto;
scroll-snap-type:x mandatory;
padding-bottom:10px;
}

.carousel::-webkit-scrollbar{
height:5px;
}

.carousel::-webkit-scrollbar-thumb{
background:var(--secondary);
border-radius:20px;
}

.card{
min-width:320px;
background:white;
border-radius:24px;
overflow:hidden;
scroll-snap-align:start;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.card img,
.card video{
width:100%;
height:220px;
object-fit:cover;
display:block;
cursor:pointer;
}

.card-content{
padding:18px;
}

.card-content h3{
margin-bottom:10px;
color:var(--primary);
}

.date{
margin-top:12px;
font-size:.82rem;
color:var(--secondary);
}

/* VIEWER */

.viewer{
position:fixed;
inset:0;
background:rgba(0,0,0,.94);
display:none;
justify-content:center;
align-items:center;
z-index:99999;
}

.viewer img,
.viewer video{
max-width:92%;
max-height:92%;
border-radius:20px;
}

.close-viewer{
position:absolute;
top:20px;
right:25px;
font-size:2rem;
color:white;
cursor:pointer;
}

/* ADMIN */

.admin-btn{
position:fixed;
right:25px;
bottom:25px;
width:65px;
height:65px;
border:none;
border-radius:50%;
background:linear-gradient(45deg,var(--primary),var(--secondary));
color:white;
font-size:1.5rem;
cursor:pointer;
z-index:999;
}

.panel{
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
display:none;
justify-content:center;
align-items:center;
z-index:99999;
}

.box{
width:95%;
max-width:500px;
background:white;
padding:30px;
border-radius:28px;
}

.box h2{
margin-bottom:20px;
color:var(--primary);
}

.box input,
.box textarea{
width:100%;
padding:14px;
margin-bottom:15px;
border:none;
border-radius:14px;
background:#f3f7f7;
}

.box button{
width:100%;
padding:14px;
border:none;
border-radius:14px;
background:linear-gradient(45deg,var(--primary),var(--secondary));
color:white;
font-weight:600;
cursor:pointer;
}

.close-btn{
margin-top:10px;
background:#333 !important;
}

/* DASHBOARD */

.dashboard-item{
background:#f3f7f7;
padding:14px;
border-radius:14px;
margin-top:12px;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.dashboard-item button{
width:auto;
padding:10px 14px;
}

.delete-btn{
background:#ef4444 !important;
}

/* MOBILE */

@media(max-width:768px){

.hero h1{
font-size:2.5rem;
}

nav ul{
display:none;
}

.card{
min-width:280px;
}

}

</style>
</head>

<body>

<nav>

<div class="logo">
🕌 Mushola AR-ROHMAN
</div>

<ul>
<li><a href="#">Beranda</a></li>
<li><a href="#galeri">Galeri</a></li>
</ul>

</nav>

<section class="hero">

<div class="hero-content">

<h1>Mushola V4 PRO</h1>

<p>
Website mushola modern dengan upload online Cloudinary.
</p>

<a href="#galeri" class="btn">
Lihat Galeri
</a>

</div>

</section>

<section id="galeri">

<div class="title">
<h2>Galeri Kegiatan</h2>
<p>Dokumentasi kegiatan mushola</p>
</div>

<div class="carousel" id="gallery"></div>

</section>

<!-- VIEWER -->

<div class="viewer" id="viewer">

<div class="close-viewer"
onclick="closeViewer()">
✕
</div>

<div id="viewerContent"></div>

</div>

<!-- ADMIN -->

<button class="admin-btn"
onclick="openPanel()">
⚙
</button>

<div class="panel" id="panel">

<div class="box">

<h2>Upload Kegiatan</h2>

<input type="text"
id="title"
placeholder="Judul kegiatan">

<textarea
id="desc"
placeholder="Deskripsi"></textarea>

<input type="date"
id="date">

<input type="file"
id="file"
multiple>

<button onclick="uploadMedia()">
Upload Online
</button>

<button
class="close-btn"
onclick="closePanel()">
Tutup
</button>

<div id="dashboard"></div>

</div>

</div>

<script>

/* =========================
   CLOUDINARY
========================= */

const CLOUD_NAME = "dqx4y6l8l";
const UPLOAD_PRESET = "mushola_upload";

/* =========================
   STORAGE
========================= */

let gallery =
JSON.parse(
localStorage.getItem("gallery")
) || [];

/* =========================
   RENDER
========================= */

function renderGallery(){

const wrap =
document.getElementById("gallery");

wrap.innerHTML="";

gallery.forEach((item,index)=>{

let media="";

if(item.type==="image"){

media=`
<img
src="${item.url}"
onclick="openViewer(
'${item.url}',
'image'
)">
`;

}else{

media=`
<video controls>
<source src="${item.url}">
</video>
`;

}

wrap.innerHTML += `

<div class="card">

${media}

<div class="card-content">

<h3>${item.title}</h3>

<p>${item.desc}</p>

<div class="date">
${item.date}
</div>

</div>

</div>

`;

});

renderDashboard();

}

/* =========================
   VIEWER
========================= */

function openViewer(src,type){

const viewer =
document.getElementById("viewer");

const content =
document.getElementById("viewerContent");

if(type==="image"){

content.innerHTML=`
<img src="${src}">
`;

}else{

content.innerHTML=`
<video controls autoplay>
<source src="${src}">
</video>
`;

}

viewer.style.display="flex";

}

function closeViewer(){

document.getElementById("viewer")
.style.display="none";

}

/* =========================
   PANEL
========================= */

function openPanel(){

document.getElementById("panel")
.style.display="flex";

}

function closePanel(){

document.getElementById("panel")
.style.display="none";

}

/* =========================
   UPLOAD
========================= */

async function uploadMedia(){

const title =
document.getElementById("title")
.value.trim();

const desc =
document.getElementById("desc")
.value.trim();

const date =
document.getElementById("date")
.value;

const files =
document.getElementById("file")
.files;

if(!title || !desc || !date){

alert("Lengkapi data");
return;

}

if(files.length===0){

alert("Pilih file");
return;

}

for(const file of files){

const formData =
new FormData();

formData.append(
"file",
file
);

formData.append(
"upload_preset",
UPLOAD_PRESET
);

const res = await fetch(

`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`,

{
method:"POST",
body:formData
}

);

const data =
await res.json();

const type =
file.type.startsWith("video")
? "video"
: "image";

gallery.unshift({

title:title,
desc:desc,
date:date,
type:type,
url:data.secure_url

});

}

localStorage.setItem(
"gallery",
JSON.stringify(gallery)
);

renderGallery();

alert("Upload berhasil online");

document.getElementById("title")
.value="";

document.getElementById("desc")
.value="";

document.getElementById("date")
.value="";

document.getElementById("file")
.value="";

closePanel();

}

/* =========================
   DASHBOARD
========================= */

function renderDashboard(){

const dash =
document.getElementById("dashboard");

dash.innerHTML="<h3 style='margin-top:20px;'>Kelola Galeri</h3>";

gallery.forEach((item,index)=>{

dash.innerHTML += `

<div class="dashboard-item">

<div>
<strong>${item.title}</strong>
</div>

<div style="display:flex;gap:8px;">

<button
onclick="editGallery(${index})">
Edit
</button>

<button
class="delete-btn"
onclick="deleteGallery(${index})">
Hapus
</button>

</div>

</div>

`;

});

}

/* =========================
   DELETE
========================= */

function deleteGallery(index){

if(confirm("Hapus kegiatan?")){

gallery.splice(index,1);

localStorage.setItem(
"gallery",
JSON.stringify(gallery)
);

renderGallery();

}

}

/* =========================
   EDIT
========================= */

function editGallery(index){

const item =
gallery[index];

const title =
prompt(
"Edit Judul",
item.title
);

if(title===null)return;

const desc =
prompt(
"Edit Deskripsi",
item.desc
);

if(desc===null)return;

const date =
prompt(
"Edit Tanggal",
item.date
);

if(date===null)return;

gallery[index]={

...item,
title:title,
desc:desc,
date:date

};

localStorage.setItem(
"gallery",
JSON.stringify(gallery)
);

renderGallery();

}

/* =========================
   INIT
========================= */

renderGallery();

</script>

</body>
</html>
