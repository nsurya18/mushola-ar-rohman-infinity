<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mushola AR-ROHMAN CLEAN FIX</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#0f766e;
  --secondary:#14b8a6;
  --gold:#d4af37;
  --bg:#071313;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  height:100%;
  scroll-behavior:smooth;
  font-family:Poppins,sans-serif;
  background:linear-gradient(180deg,#071313,#0b1d1d);
  color:#fff;
  overflow-x:hidden;
}

/* NAV */
nav{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 5%;
  background:rgba(0,0,0,.4);
  backdrop-filter:blur(10px);
  z-index:9999;
}

.logo{
  color:#fff;
  font-weight:700;
}

nav ul{
  display:flex;
  gap:14px;
  list-style:none;
}

nav a{
  color:#fff;
  text-decoration:none;
  font-size:.9rem;
}

.menu-toggle{
  display:none;
  font-size:26px;
  color:#fff;
  cursor:pointer;
}

/* HERO */
.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:90px 20px;
}

.hero h1{
  font-size:2.5rem;
  color:var(--gold);
}

.hero p{
  opacity:.8;
  margin-top:10px;
}

/* SECTION */
section{
  padding:70px 5%;
}

.section-title{
  text-align:center;
  margin-bottom:25px;
}

.section-title h2{
  color:var(--gold);
}

/* CARD */
.card{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  padding:18px;
  border-radius:18px;
}

.carousel{
  display:flex;
  overflow-x:auto;
  gap:14px;
}

/* GALERI */
.gallery-card img{
  width:100%;
  border-radius:14px;
}

/* PUSTAKA MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999999;
}

.modal-box{
  background:#111;
  padding:20px;
  border-radius:16px;
  width:90%;
  max-width:500px;
}

/* ADMIN BUTTON - FIXED HARD */
.admin-btn{
  position:fixed !important;
  right:18px !important;
  bottom:18px !important;
  width:65px !important;
  height:65px !important;
  border-radius:50% !important;
  background:linear-gradient(135deg,#14b8a6,#d4af37) !important;
  color:#000 !important;
  font-size:26px !important;
  font-weight:700 !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  z-index:2147483647 !important;
  cursor:pointer !important;
  pointer-events:auto !important;
  border:none !important;
}

/* HARD KILL BUG ELEMENT (ICON NYASAR FIX) */
.pustaka-card::before,
.pustaka-card::after,
.card::before,
.card::after{
  display:none !important;
  content:none !important;
}

/* FOOTER */
footer{
  text-align:center;
  padding:40px;
  opacity:.8;
}

@media(max-width:768px){
  nav ul{
    display:none;
    position:absolute;
    top:60px;
    left:5%;
    right:5%;
    flex-direction:column;
    background:#000;
    padding:15px;
    border-radius:12px;
  }

  nav ul.active{
    display:flex;
  }

  .menu-toggle{
    display:block;
  }
}

</style>
</head>
<body>

<nav>
  <div class="logo">🕌 Mushola AR-ROHMAN</div>
  <div class="menu-toggle" onclick="document.querySelector('nav ul').classList.toggle('active')">☰</div>
  <ul>
    <li><a href="#">Home</a></li>
    <li><a href="#galeri">Galeri</a></li>
    <li><a href="#pustaka">Pustaka</a></li>
  </ul>
</nav>

<section class="hero">
  <div>
    <h1>Selamat Datang</h1>
    <p>Mushola AR-ROHMAN Digital</p>
  </div>
</section>

<section id="galeri">
  <div class="section-title"><h2>Galeri</h2></div>
  <div class="carousel" id="gallery"></div>
</section>

<section id="pustaka">
  <div class="section-title"><h2>Pustaka Ilmu</h2></div>
  <div class="carousel">
    <div class="card" onclick="openPustaka('Dzikir','Dzikir menenangkan hati')">Dzikir</div>
    <div class="card" onclick="openPustaka('Doa','Doa harian muslim')">Doa</div>
  </div>
</section>

<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="mTitle"></h3>
    <p id="mText"></p>
    <button onclick="closePustaka()">Tutup</button>
  </div>
</div>

<!-- ADMIN BUTTON CLEAN -->
<div class="admin-btn" onclick="openAdmin()">⚙</div>

<footer>
  Mushola AR-ROHMAN © 2026
</footer>

<script>

let gallery=[];

function renderGallery(){
  const g=document.getElementById('gallery');
  if(!g) return;
  g.innerHTML='';
  gallery.forEach(item=>{
    g.innerHTML+=`<div class='card gallery-card'>
      <img src='${item.url||"https://via.placeholder.com/300"}'>
      <p>${item.title||"Kegiatan"}</p>
    </div>`;
  });
}

function openPustaka(t,x){
  document.getElementById('mTitle').innerText=t;
  document.getElementById('mText').innerText=x;
  document.getElementById('modal').style.display='flex';
}

function closePustaka(){
  document.getElementById('modal').style.display='none';
}

function openAdmin(){
  alert('Admin panel ready');
}

renderGallery();

</script>

</body>
</html>
